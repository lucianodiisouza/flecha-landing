<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Google Analytics 4 (described in the privacy policy). Download clicks go out as file_download. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y05X9Z4PQJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Y05X9Z4PQJ', { allow_google_signals: false, allow_ad_personalization_signals: false });
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href*="dl.flecha.dev/"]');
      if (a) gtag('event', 'file_download', { file_name: a.pathname.slice(1), link_url: a.href });
    });
  </script>
  <title>Page not found · Flecha</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="not-found">
    <div class="inner nf-inner">
      <img class="nf-mark" src="/assets/brand/flecha-mark.svg" alt="" width="88" height="88">
      <p class="eyebrow">404</p>
      <h1>This arrow missed.</h1>
      <p class="lede">The page you're looking for isn't here. <span lang="pt-BR">Esta página não existe.</span></p>
      <div class="cta-row">
        <a class="btn" href="/">Back to flecha.dev</a>
        <a class="btn btn-ghost" href="/pt-br/" lang="pt-BR">Voltar ao início</a>
      </div>
    </div>
  </main>
</body>
</html>
